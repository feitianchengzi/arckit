interface:
  display_name: "Arckit Git Branching"
  short_description: "显式授权的分支和 tag 远端触发规范"
  default_prompt: >-
    使用 $arckit-git-branching 处理用户明确提出的分支策略/维护、release/feature/hotfix、
    多版本回流、tag 出包触发和远端失败证据。入口先执行操作级授权门禁：默认保持当前分支；
    普通 status/add/commit/log/diff 不单独触发，commit 只授权在当前分支提交；没有明确的
    create/switch/merge/delete/backport/push 分支要求或确认时，不得进入 branch-maintenance，
    也不得因任务风险、发布规则或先前策略讨论自行创建分支。沿用仍有效的明确授权；
    授权或目标不明时推荐，已满足执行条件时直接执行最小 branch/tag Git 写操作。
    按 reference 核对同一发布单元、目标 commit 和仓库内版本/CI 配置，实际触发以配置为准。
    远端失败只收集原始证据；不得扩展到本地构建、签名、上传、平台操作、远端状态追踪或无证据修复。
