interface:
  display_name: "反馈平台接入"
  short_description: "接入 SDK WebView V2 或独立原生 API，支持客户端 Key、宿主 Session 和未读角标"
  default_prompt: "使用 $arckit-feedback-platform-integration 接入或升级反馈平台。先选择 sdk-webview 或独立 native-api；WebView 选择 sdkAuthMode，新接入默认已核验最新稳定版（当前 V2），原生默认 nativeApiVersion=v2 并选择 nativeAuthMode，V2 两种认证均支持核心 HTTP 能力。使用内置采集器或等价安全参数流采集 V2 认证、网关、宿主接口和通知配置，默认做单一反馈中心入口，并明确凭证、稳定用户身份、验证证据和未知平台契约。"

policy:
  allow_implicit_invocation: true

behavior:
  language: "zh-Hans"
  hard_boundaries:
    - "新接入默认已核验最新稳定版，当前 V2；V1 仅限用户明确指定或已有项目的已确认兼容约束，并说明依据。采集器限制不得改变默认版本，V2 失败不得自动降级，不猜测更高版本。"
    - "区分 SDK bridge 与 V2 HTTP 契约，原生按 reference 使用已核验的 Session/API Key、消息、附件和通知接口。"
    - "维护原生声明先核对配置 UI、路由、handler 和 client；智能客服权限与 API Key 实时通道等限制明确保留。"
    - "客户端 apiKey 模式必须使用项目专用且可轮换的 Key，并明确客户端可提取。"
    - "session 模式由宿主服务保存 API Key；客户端不把 API Key 或短期 token 写入 URL、日志和持久化。"
    - "Session WebView 必须消费 feedback-sdk:refresh-session 主动事件并合并并发刷新；失败后重试只作为有限兜底。"
    - "常规 SDK 接入直接使用 skill 内置 V2 契约；不得下载或反向分析 /sdk-v2/assets/ 来重新发现已记录协议。"
    - "先区分原生 WebView、已具备 SDK global 的 Web 同页和跨域 iframe；跨域 iframe 使用 ready/configure/open 宿主协议并严格校验 origin/source。"
    - "默认通过参数 UI 或等价安全通道采集；任何模式都不在日志或最终回复输出完整凭证。"
  required_outputs:
    - "说明目标平台、已有实现属于客户端壳、占位实现还是完整接入。"
    - "说明 integrationMode；SDK WebView 还要说明承载方式、sdkAuthMode 和 notificationsEnabled。"
    - "说明平台官网引导、反馈入口形态以及 Project ID、API Key、Session token、customUserId 的来源和生命周期策略。"
    - "列出修改文件、验证证据、未完成风险和原生 API 的已确认版本及选择依据；使用 V1 时必须说明例外原因。"
