<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办管理系统 - 完整功能演示</title>
    <style>
        :root {
            /* DesignTokens - Colors */
            --primary: #2563EB;
            --primary-hover: #1d4ed8;
            --secondary: #64748B;
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --info: #3B82F6;
            
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8FAFC;
            --bg-tertiary: #F1F5F9;
            
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --text-disabled: #CBD5E1;
            
            --border-primary: #E2E8F0;
            --border-secondary: #CBD5E1;
            
            /* DesignTokens - Spacing */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
            
            /* DesignTokens - Typography */
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-size-display: 48px;
            --font-size-title1: 32px;
            --font-size-title2: 24px;
            --font-size-title3: 20px;
            --font-size-body: 16px;
            --font-size-small: 14px;
            --font-size-caption: 12px;
            
            /* DesignTokens - CornerRadius */
            --radius-small: 4px;
            --radius-medium: 8px;
            --radius-large: 12px;
            --radius-xlarge: 16px;
            
            /* DesignTokens - Shadows */
            --shadow-light: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-medium: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-heavy: 0 10px 15px rgba(0,0,0,0.15);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: var(--font-family);
            font-size: var(--font-size-body);
            line-height: 1.5;
            color: var(--text-primary);
            background-color: var(--bg-secondary);
        }
        
        /* 导航栏 */
        .navbar {
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-primary);
            padding: var(--spacing-md) var(--spacing-xl);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .navbar-brand {
            font-size: var(--font-size-title3);
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }
        
        .navbar-actions {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        
        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }
        
        /* 应用布局 - 侧边栏布局 */
        .app-layout {
            display: flex;
            min-height: calc(100vh - 80px);
            background-color: var(--bg-primary);
        }
        
        /* 侧边栏 */
        .sidebar {
            width: 256px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-primary);
            padding: var(--spacing-lg) var(--spacing-md);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-light);
        }
        
        .sidebar-profile {
            padding: var(--spacing-md);
            background-color: var(--bg-primary);
            border-radius: var(--radius-medium);
            margin-bottom: var(--spacing-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .sidebar-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: var(--font-size-small);
        }
        
        .sidebar-username {
            font-weight: 600;
            color: var(--text-primary);
            font-size: var(--font-size-small);
        }
        
        .sidebar-settings {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-medium);
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .sidebar-settings:hover {
            background-color: var(--bg-tertiary);
        }
        
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
        }
        
        .sidebar-nav-item {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-medium);
            margin-bottom: var(--spacing-xs);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-size: var(--font-size-body);
        }
        
        .sidebar-nav-item:hover {
            background-color: var(--bg-tertiary);
        }
        
        .sidebar-nav-item.active {
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            font-weight: 600;
        }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .main-content-header {
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-primary);
            padding: var(--spacing-md) var(--spacing-xl);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .main-content-body {
            flex: 1;
            padding: var(--spacing-xl);
            overflow-y: auto;
        }
        
        /* 页面视图 */
        .page {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .page.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 按钮 */
        .btn {
            padding: var(--spacing-sm) var(--spacing-lg);
            border: none;
            border-radius: var(--radius-medium);
            font-size: var(--font-size-body);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-hover);
            box-shadow: var(--shadow-medium);
        }
        
        .btn-secondary {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-primary);
        }
        
        .btn-secondary:hover {
            background-color: var(--bg-secondary);
        }
        
        .btn-danger {
            background-color: var(--error);
            color: white;
        }
        
        /* 卡片 */
        .card {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-large);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            box-shadow: var(--shadow-light);
            transition: all 0.2s ease;
        }
        
        .card:hover {
            box-shadow: var(--shadow-medium);
            transform: translateY(-2px);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }
        
        .card-title {
            font-size: var(--font-size-title3);
            font-weight: 600;
            color: var(--text-primary);
        }
        
        /* 表单 */
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .form-label .required {
            color: var(--error);
        }
        
        .form-input {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-medium);
            font-size: var(--font-size-body);
            font-family: var(--font-family);
            transition: all 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .form-select {
            cursor: pointer;
        }
        
        .error-message {
            color: var(--error);
            font-size: var(--font-size-small);
            margin-top: var(--spacing-xs);
        }
        
        /* 徽章 */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: var(--font-size-caption);
            font-weight: 600;
        }
        
        .badge-pending {
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        
        .badge-in-progress {
            background-color: var(--info);
            color: white;
        }
        
        .badge-completed {
            background-color: var(--success);
            color: white;
        }
        
        .badge-p1 {
            background-color: #FEE2E2;
            color: #DC2626;
        }
        
        .badge-p2 {
            background-color: #FEF3C7;
            color: #D97706;
        }
        
        /* 列表 */
        .list-item {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--border-primary);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .list-item:hover {
            background-color: var(--bg-secondary);
        }
        
        .list-item:last-child {
            border-bottom: none;
        }
        
        /* 网格布局 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-lg);
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--text-secondary);
        }
        
        .empty-state-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--spacing-lg);
            border: 2px solid var(--border-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        
        /* 工具提示 */
        .tooltip {
            position: relative;
        }
        
        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: var(--spacing-xs) var(--spacing-sm);
            background-color: var(--text-primary);
            color: white;
            border-radius: var(--radius-small);
            font-size: var(--font-size-small);
            white-space: nowrap;
            margin-bottom: var(--spacing-xs);
        }
        
        /* 页面特定样式 */
        .login-container {
            max-width: 400px;
            margin: var(--spacing-2xl) auto;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .page-title {
            font-size: var(--font-size-title1);
            font-weight: 700;
        }
        
        .meta-info {
            display: flex;
            gap: var(--spacing-md);
            color: var(--text-secondary);
            font-size: var(--font-size-small);
        }
        
        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: var(--spacing-md);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-medium);
            margin-bottom: var(--spacing-sm);
            background-color: var(--bg-primary);
        }
        
        .todo-content {
            flex: 1;
        }
        
        .todo-title {
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
        }
        
        .todo-description {
            color: var(--text-secondary);
            font-size: var(--font-size-small);
            margin-bottom: var(--spacing-sm);
        }
        
        .todo-meta {
            display: flex;
            gap: var(--spacing-md);
            font-size: var(--font-size-small);
            color: var(--text-secondary);
        }
        
        .todo-actions {
            display: flex;
            gap: var(--spacing-sm);
        }
        
        .btn-icon {
            padding: var(--spacing-xs);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: var(--font-size-body);
        }
        
        .btn-icon:hover {
            color: var(--primary);
        }
        
        /* 成员列表样式 */
        .member-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm);
            border-radius: var(--radius-medium);
            margin-bottom: var(--spacing-xs);
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s;
        }
        
        .member-item:hover {
            background-color: var(--bg-secondary);
        }
        
        .popover-todo-item {
            padding: var(--spacing-sm);
            border-bottom: 1px solid var(--border-primary);
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .popover-todo-item:hover {
            background-color: var(--bg-secondary);
        }
        
        .popover-todo-item:last-child {
            border-bottom: none;
        }
        
        /* 成员项选中状态 */
        .member-item.active {
            background-color: var(--bg-secondary);
        }
        
        .todo-item {
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        
        .todo-item:hover {
            background-color: var(--bg-secondary);
            box-shadow: var(--shadow-light);
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-md);
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
            
            .navbar {
                padding: var(--spacing-md);
            }
            
            .navbar-actions {
                flex-direction: column;
                gap: var(--spacing-sm);
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar" style="display: none;">
        <a href="#" class="navbar-brand" onclick="showPage('project-list'); return false;">待办管理系统</a>
        <div class="navbar-actions">
            <div class="user-info">
                <div class="avatar" id="userAvatar">张</div>
                <span id="userName">张三</span>
            </div>
            <button class="btn btn-secondary" onclick="showPage('login'); logout();">退出登录</button>
        </div>
    </nav>

    <!-- 登录页面 -->
    <div id="login-page" class="page active">
        <div class="container">
            <div class="login-container">
                <h1 class="page-title" style="text-align: center; margin-bottom: var(--spacing-xl);">登录</h1>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-input" id="login-email" placeholder="请输入邮箱" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" id="login-password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: var(--spacing-md);">登录</button>
                    <div style="text-align: center;">
                        <a href="#" onclick="showPage('register'); return false;" style="color: var(--primary); text-decoration: none;">还没有账号？立即注册</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 注册页面 -->
    <div id="register-page" class="page">
        <div class="container">
            <div class="login-container">
                <h1 class="page-title" style="text-align: center; margin-bottom: var(--spacing-xl);">注册</h1>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">用户名 <span class="required">*</span></label>
                        <input type="text" class="form-input" id="register-username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">邮箱 <span class="required">*</span></label>
                        <input type="email" class="form-input" id="register-email" placeholder="请输入邮箱" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码 <span class="required">*</span></label>
                        <input type="password" class="form-input" id="register-password" placeholder="请输入密码" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">确认密码 <span class="required">*</span></label>
                        <input type="password" class="form-input" id="register-confirm" placeholder="请再次输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: var(--spacing-md);">注册</button>
                    <div style="text-align: center;">
                        <a href="#" onclick="showPage('login'); return false;" style="color: var(--primary); text-decoration: none;">已有账号？立即登录</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 项目列表页面 -->
    <div id="project-list-page" class="page">
        <div class="app-layout">
            <div class="sidebar">
                <div class="sidebar-profile">
                    <div class="sidebar-avatar">张</div>
                    <div class="sidebar-username" id="sidebar-username">张三</div>
                </div>
                <div class="sidebar-settings" onclick="showSettings()">
                    <span>⚙️</span>
                    <span>设置</span>
                </div>
                <div class="sidebar-nav">
                    <div class="sidebar-nav-item active" onclick="showPage('project-list')">
                        <span>📁</span>
                        <span>项目列表</span>
                    </div>
                    <div class="sidebar-nav-item" onclick="showPage('todo-list')">
                        <span>✓</span>
                        <span>待办事项</span>
                    </div>
                    <div class="sidebar-nav-item" onclick="showPage('member-management')">
                        <span>👥</span>
                        <span>成员管理</span>
                    </div>
                </div>
            </div>
            <div class="main-content">
                <div class="main-content-header">
                    <h1 class="page-title">我的项目</h1>
                    <button class="btn btn-primary" onclick="showPage('create-project')">+ 创建项目</button>
                </div>
                <div class="main-content-body">
                    <div class="grid" id="project-list">
                        <!-- 项目卡片将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建项目页面 -->
    <div id="create-project-page" class="page">
        <div class="container">
            <div style="max-width: 600px; margin: 0 auto;">
                <div class="page-header">
                    <h1 class="page-title">创建项目</h1>
                    <button class="btn btn-secondary" onclick="showPage('project-list')">取消</button>
                </div>
                <form onsubmit="handleCreateProject(event)">
                    <div class="form-group">
                        <label class="form-label">项目名称 <span class="required">*</span></label>
                        <input type="text" class="form-input" id="project-name" placeholder="请输入项目名称" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">项目描述</label>
                        <textarea class="form-input form-textarea" id="project-description" placeholder="请输入项目描述（可选）"></textarea>
                    </div>
                    <div style="display: flex; gap: var(--spacing-md); justify-content: flex-end;">
                        <button type="button" class="btn btn-secondary" onclick="showPage('project-list')">取消</button>
                        <button type="submit" class="btn btn-primary">创建</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 项目详情页面 -->
    <div id="project-detail-page" class="page">
        <div class="app-layout">
            <div class="sidebar">
                <div class="sidebar-profile">
                    <div class="sidebar-avatar">张</div>
                    <div class="sidebar-username" id="sidebar-username-detail">张三</div>
                </div>
                <div class="sidebar-settings" onclick="showSettings()">
                    <span>⚙️</span>
                    <span>设置</span>
                </div>
                <div class="sidebar-nav">
                    <div class="sidebar-nav-item active" onclick="showPage('project-list')">
                        <span>📁</span>
                        <span>项目列表</span>
                    </div>
                    <div class="sidebar-nav-item" onclick="showPage('todo-list')">
                        <span>✓</span>
                        <span>待办事项</span>
                    </div>
                    <div class="sidebar-nav-item" onclick="showPage('member-management')">
                        <span>👥</span>
                        <span>成员管理</span>
                    </div>
                </div>
            </div>
            <div class="main-content">
                <div class="main-content-header">
                    <div>
                        <button class="btn btn-secondary" onclick="showPage('project-list')" style="margin-bottom: var(--spacing-md);">← 返回</button>
                        <h1 class="page-title" id="project-detail-title">项目详情</h1>
                        <div class="meta-info" id="project-detail-meta"></div>
                    </div>
                    <div style="display: flex; gap: var(--spacing-md);">
                        <button class="btn btn-primary" onclick="showPage('create-todo')">+ 创建待办</button>
                        <button class="btn btn-secondary" onclick="showPage('invite-member')">邀请成员</button>
                    </div>
                </div>
                <div class="main-content-body">
                    <div style="display: flex; gap: var(--spacing-xl);">
                        <div style="flex: 1;">
                            <div class="card" style="margin-bottom: var(--spacing-xl);">
                                <div id="project-info">
                                    <!-- 项目信息将通过JavaScript动态生成 -->
                                </div>
                            </div>

        // 显示成员气泡
        function showMemberPopover(memberItem, member, todos) {
            // 移除已存在的气泡
            const existingPopover = document.getElementById('member-popover');
            if (existingPopover) {
                existingPopover.remove();
            }
            
            // 获取该成员参与的待办
            const memberTodos = todos.filter(todo => todo.assigneeId === member.id || todo.creatorId === member.id);
            
            if (memberTodos.length === 0) {
                // 即使没有待办，也显示一个提示
                const popover = document.createElement('div');
                popover.id = 'member-popover';
                popover.dataset.memberId = member.id;
                popover.style.cssText = 'position: fixed; background-color: white; border: 1px solid var(--border-primary); border-radius: var(--radius-large); box-shadow: 0 10px 15px rgba(0,0,0,0.15); padding: var(--spacing-md); z-index: 10000; min-width: 300px; max-width: 400px; max-height: 400px; overflow-y: auto;';
                
                // 计算位置
                const rect = memberItem.getBoundingClientRect();
                popover.style.left = (rect.right + 10) + 'px';
                popover.style.top = rect.top + 'px';
                
                popover.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-sm); padding-bottom: var(--spacing-sm); border-bottom: 1px solid var(--border-primary);">
                        <div style="font-weight: 600; font-size: 0.875rem;">${member.username}参与的待办</div>
                        <button onclick="hideMemberPopover()" style="background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--text-secondary); padding: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;">×</button>
                    </div>
                    <div style="text-align: center; padding: var(--spacing-xl); color: var(--text-secondary);">
                        <p>该成员还没有参与的待办事项</p>
                    </div>
                `;
                
                document.body.appendChild(popover);
                return;
            }
            
            const popover = document.createElement('div');
            popover.id = 'member-popover';
            popover.dataset.memberId = member.id;
            popover.style.cssText = 'position: fixed; background-color: white; border: 1px solid var(--border-primary); border-radius: var(--radius-large); box-shadow: 0 10px 15px rgba(0,0,0,0.15); padding: var(--spacing-md); z-index: 10000; min-width: 300px; max-width: 400px; max-height: 400px; overflow-y: auto;';
            
            // 计算位置，确保不超出视口
            const rect = memberItem.getBoundingClientRect();
            const popoverWidth = 350; // 预估宽度
            const popoverHeight = Math.min(400, memberTodos.length * 80 + 100); // 预估高度
            
            let left = rect.right + 10;
            let top = rect.top;
            
            // 如果右侧空间不足，显示在左侧
            if (left + popoverWidth > window.innerWidth) {
                left = rect.left - popoverWidth - 10;
            }
            
            // 如果下方空间不足，调整顶部位置
            if (top + popoverHeight > window.innerHeight) {
                top = window.innerHeight - popoverHeight - 10;
            }
            
            popover.style.left = left + 'px';
            popover.style.top = top + 'px';
            
            let todoListHTML = memberTodos.map(todo => {
                const statusClass = {
                    'pending': 'badge-pending',
                    'in-progress': 'badge-in-progress',
                    'completed': 'badge-completed'
                }[todo.status];
                
                const statusText = {
                    'pending': '待处理',
                    'in-progress': '进行中',
                    'completed': '已完成'
                }[todo.status];
                
                return `
                    <div class="popover-todo-item" onclick="event.stopPropagation(); showTodoDetail(${todo.id}); hideMemberPopover();" style="padding: var(--spacing-sm); border-bottom: 1px solid var(--border-primary); cursor: pointer;">
                        <div style="font-weight: 600; font-size: 0.875rem; margin-bottom: var(--spacing-xs);">${todo.title}</div>
                        <div style="display: flex; gap: var(--spacing-sm); font-size: 0.75rem; color: var(--text-secondary); align-items: center;">
                            <span class="badge ${statusClass}">${statusText}</span>
                            <span>${todo.assigneeId === member.id ? '执行人' : '创建人'}</span>
                        </div>
                    </div>
                `;
            }).join('');
            
            popover.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-sm); padding-bottom: var(--spacing-sm); border-bottom: 1px solid var(--border-primary);">
                    <div style="font-weight: 600; font-size: 0.875rem;">${member.username}参与的待办</div>
                    <button onclick="hideMemberPopover()" style="background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--text-secondary); padding: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; transition: color 0.2s;" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-secondary)'">×</button>
                </div>
                ${todoListHTML}
                <div style="padding-top: var(--spacing-sm); border-top: 1px solid var(--border-primary);">
                    <button class="btn btn-secondary" onclick="event.stopPropagation(); quickComment(${member.id}); hideMemberPopover();" style="width: 100%; font-size: 0.75rem; padding: var(--spacing-xs) var(--spacing-sm);">💬 快速评论</button>
                </div>
            `;
            
            document.body.appendChild(popover);
            
            // 点击外部区域关闭气泡
            setTimeout(() => {
                const closeOnOutsideClick = (e) => {
                    if (!popover.contains(e.target) && !memberItem.contains(e.target)) {
                        hideMemberPopover();
                        document.removeEventListener('click', closeOnOutsideClick);
                    }
                };
                // 延迟添加事件监听，避免立即触发
                setTimeout(() => {
                    document.addEventListener('click', closeOnOutsideClick);
                }, 100);
            }, 0);
        }

        // 生成邀请码
        function handleGenerateInviteCode(event) {
            event.preventDefault();
            const role = document.getElementById('invite-role').value;
            const expiryHours = parseInt(document.getElementById('invite-expiry').value) || 0;
            
            // 生成32位十六进制邀请码
            const inviteCode = generateInviteCode();
            const baseUrl = window.location.origin;
            const inviteLink = `${baseUrl}/join.html?code=${inviteCode}`;
            
            // 计算过期时间
            let expiryDate = null;
            if (expiryHours > 0) {
                const expiryDateObj = new Date();
                expiryDateObj.setHours(expiryDateObj.getHours() + expiryHours);
                expiryDate = expiryDateObj.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } else {
                expiryDate = '永不过期';
            }
            
            // 显示邀请码和链接
            document.getElementById('invite-code-display').textContent = inviteCode;
            document.getElementById('invite-link-display').textContent = inviteLink;
            document.getElementById('invite-expiry-display').textContent = expiryDate;
            document.getElementById('invite-code-section').style.display = 'block';
            
            // 保存邀请码信息（用于演示）
            if (!window.inviteCodes) {
                window.inviteCodes = [];
            }
            window.inviteCodes.push({
                code: inviteCode,
                role: role,
                expiryHours: expiryHours,
                createdAt: new Date()
            });
        }
        
        // 生成32位十六进制邀请码
        function generateInviteCode() {
            const chars = '0123456789ABCDEF';
            let code = '';
            for (let i = 0; i < 32; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }
        
        // 复制邀请码
        function copyInviteCode() {
            const code = document.getElementById('invite-code-display').textContent;
            navigator.clipboard.writeText(code).then(() => {
                showToast('邀请码已复制到剪贴板', 'success');
            }).catch(() => {
                // 降级方案
                const textarea = document.createElement('textarea');
                textarea.value = code;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('邀请码已复制到剪贴板', 'success');
            });
        }

        // 显示设置（占位函数）
        function showSettings() {
            alert('设置功能开发中...');
        }
        
        // 显示 Toast 提示
        function showToast(message, type = 'info') {
            // 创建 Toast 元素
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: var(--spacing-md) var(--spacing-lg);
                background-color: ${type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--error)' : 'var(--info)'};
                color: white;
                border-radius: var(--radius-medium);
                box-shadow: var(--shadow-medium);
                z-index: 10000;
                animation: slideIn 0.3s ease-out;
            `;
            toast.textContent = message;
            
            // 添加动画样式
            if (!document.getElementById('toast-styles')) {
                const style = document.createElement('style');
                style.id = 'toast-styles';
                style.textContent = `
                    @keyframes slideIn {
                        from {
                            transform: translateX(100%);
                            opacity: 0;
                        }
                        to {
                            transform: translateX(0);
                            opacity: 1;
                        }
                    }
                `;
                document.head.appendChild(style);
            }
            
            document.body.appendChild(toast);
            
            // 3秒后自动移除
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease-out reverse';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // 退出登录
        function logout() {
            mockData.currentProjectId = null;
            mockData.currentTodoId = null;
            showPage('login');
        }

        // 评论输入框快捷键
        document.addEventListener('keydown', (e) => {
            const commentInput = document.getElementById('comment-input');
            if (commentInput && commentInput === document.activeElement && e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                submitComment();
            }
        });
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 默认显示登录页面
            showPage('login');
        });
    </script>
</body>
