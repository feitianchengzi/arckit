interface:
  display_name: "Arckit Development Ledger"
  short_description: "确定性维护 ledger 状态、协议恢复与 transition"
  default_prompt: "使用 $arckit-development-ledger 通过 trusted snapshot、Case-scoped selection token、Transition v8、完整 invariant assessment 和 round closeout 确定性维护 Project/Iteration/Case；协议不兼容时在 Case 外验收 Agent 的语义 reconciliation。"
policy:
  allow_implicit_invocation: true
workflow:
  first_steps:
    - "先读取 loop snapshot；只有 available 才进入正常 Project/Case audit，unavailable 则只接受 protocol reconciliation。"
    - "读取 Project v5、全部 active Case v5 和 Iteration v3，校验软件定义清单、核心不变量和 facts/impacts/gaps。"
    - "从全部 active Cases 恢复候选集；每个 Loop 可选择无序 candidate，或提交一个当轮完成的 fresh gap。"
    - "通过 trusted case_transition entrypoint 校验 Case-scoped selection token、完整 candidate comparison、revision 和 gap，再应用 accepted delta。"
    - "每个被接受的 Gap transition 都可立即原子提交相关 Project delta。"
    - "普通 gaps 全部闭合后派生 completion review；修复 findings 提升 content revision，最后授权轮次仍不 clean 时转人工。"
  boundaries:
    - "Runtime 只能调用 manifest-declared trusted entrypoints，不能复制 ledger 语义。"
    - "Agent 不得直接写 ledger，只能通过 trusted Runtime entrypoint 提交。"
    - "协议恢复不是普通 Case Gap；ledger 不推断版本字段映射，只校验 Agent replacement 的 freshness、保真边界、当前 schema 与跨记录一致性。"
    - "不把 raw prompt、runtime event、skill 名或固定 workflow 写入状态。"
    - "Case、Project、iteration 与 projections/index 任一步失败时恢复提交前状态。"
    - "arckit-case-transition/v8 是唯一 transition 语义对象；stdin/文件只是 CLI transport。"
    - "完整 invariant assessment 由 Agent 作语义判断；Ledger 只校验 catalog 覆盖、引用和 disposition 结构。"
    - "产品、交互、视觉、技术长期事实证据与现实兑现、风险依据各负其责，不能用一种 evidence 替代另一种。"
    - "Apply 只返回 accepted closeout 与 post-commit token，不返回可冒充 fresh state 的下一 candidate。"
    - "不同 Case 的执行可以并行；Project、Iteration 和索引提交必须经过跨进程 Project lock。"
    - "命令与 evidence 必须逐字往返；不得为避开 `$`、引号或其他序列化字符而改写事实。"
    - "Iteration 必须使用 v3，只聚合 Project targets、逐轮 accepted changes 与 Case refs。"
    - "Project/Iteration audit 必须检查 gap coverage、durable evidence、active Case 对齐和 Case refs。"
    - "Project 软件定义来自协议清单的具体决策；software invariant 只能是跨 Case 的抽象正确性约束。"
    - "Completion Review 是唯一显式语义自查与 Case 终态门禁，不是 fact、software decision/invariant 或日常文档补齐机制。"
    - "Agent 不得修改快照的初始复审预算；只有 human-responsibility transition 可追加有限轮次。"
  output:
    - "protocol_compatibility/reconciliation_result"
    - "case_transition_result"
    - "case_record_delta"
    - "loop_handoff_delta"
    - "project_state_delta"
    - "iteration_state_delta"
    - "ledger_validation"
    - "ledger_snapshot and round_closeout"
