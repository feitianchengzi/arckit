interface:
  display_name: "ArcKit Interaction"
  short_description: "维护稳定页面交互、状态响应和灰度线框"
  default_prompt: "使用 $arckit-interaction 维护稳定页面交互事实。Agent 判断 dynamic case_gap 需要交互事实时，先读取共享 Case Gap Contract，并基于完整上下文查询、更新、确认既有事实或判定不适用；输出 document_scope 与 fact_result。实现存在不等于交互事实已确认，不写 State、不规定顺序。"
policy:
  allow_implicit_invocation: true
workflow:
  first_steps:
    - "读取 arckit/interaction/INDEX.md 并判断查询或变更。"
    - "变更时先做页面归属、状态覆盖和投影一致性分析。"
    - "只把稳定触发、响应、状态、异常和恢复行为写入事实源。"
  boundaries:
    - "本能力由 Agent 按当前 gap 动态调用，只能在交互事实与 arckit/interaction/ 写入边界内执行。"
    - "不把视觉审美、技术实现或未确认探索写成交互事实。"
    - "不依赖已移除 skill；开放问题和待处理 handoff 保留在 active case。"
  output:
    - "document_scope"
    - "fact_result"
