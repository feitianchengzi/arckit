metadata:
  project: ArcOrbit Desktop
  last_updated: "2026-08-25"
  tokens: ./design-tokens.yaml

components:
  AppShell:
    role: 建立深色控制层与亮色工作区的稳定桌面框架
    variants:
      command_center: { sidebar: "{colors.ink.900}", workspace: "{colors.ink.75}" }
      workbench: { sidebar: "{colors.ink.900}", workspace: "{colors.paper}" }
      window_chrome_macos: { surface: "{colors.ink.950}", controls: native_traffic_lights, green_action: system_full_screen, hover_panel: system_window_layout, drag_region: remaining_titlebar }
      window_chrome_windows_linux: { surface: "{colors.ink.950}", controls: [minimize, maximize, restore, close], placement: right, drag_region: remaining_titlebar }
    sizes:
      desktop: { sidebar: "{layout.sidebar_width}", titlebar: "{layout.titlebar_height}", commandbar: "{layout.commandbar_height}" }
    states: [loading, ready, degraded, maximized, full_screen]
    token_refs: [colors.ink.900, colors.ink.75, layout.sidebar_width, layout.titlebar_height, layout.commandbar_height]
    accessibility:
      requirement: macOS 保留系统原生 traffic lights 和系统布局面板；Windows/Linux 右侧窗口控件各有 46×40px 操作容器及与当前动作一致的名称和提示；控件不参与拖动，最大化状态变化同步投影为还原动作

  NavigationRow:
    role: 表达项目范围、任务状态和本地 Runtime 入口
    variants:
      default: { foreground: "rgba(255,255,255,.54)", background: transparent }
      selected: { foreground: "{colors.paper}", background: "rgba(112,106,242,.17)", indicator: "{colors.accent.hover}" }
      attention: { foreground: "{colors.warning.soft}", badge: "{colors.warning.base}" }
      status_filter: { foreground: "{colors.ink.600}", background: "{colors.ink.50}", badge: "{colors.accent.soft}", badge_position: overlay_top_right }
    sizes:
      compact: { height: "{layout.control_height}", padding_x: "{spacing.4}", typography: "{typography.label}" }
    states: [default, hover, selected, disabled, attention]
    token_refs: [colors.accent.hover, colors.warning.base, typography.label, corner_radius.small]
    accessibility:
      requirement: 当前项同时使用文字、选中表面和指示条；状态数量以不占标题布局空间的右上角角标呈现且包含在可访问名称中；每项可聚焦并以 Enter 或 Space 激活

  Icon:
    role: 以统一轮廓矢量图形表达操作、对象和状态，不使用字符或 Emoji 替代生产图标
    variants:
      action: { foreground: "{colors.ink.600}", canvas: 16 }
      navigation: { foreground: currentColor, canvas: 18 }
      semantic: { foreground: currentColor, canvas: 16 }
    sizes:
      compact: { canvas: 16, container: "{layout.compact_control_height}" }
      standard: { canvas: 18, container: "{layout.control_height}" }
    states: [default, hover, active, focus, disabled]
    token_refs: [colors.ink.600, layout.compact_control_height, layout.control_height]
    accessibility:
      requirement: 装饰图标对辅助技术隐藏；独立图标操作提供可访问名称和悬停提示

  MetricCard:
    role: 仅在两个以上可比较指标直接支持当前判断时提供态势摘要，不作为页面默认容器
    variants:
      neutral: { surface: "{colors.paper}", value: "{colors.ink.900}" }
      running: { surface: "{colors.accent.faint}", value: "{colors.accent.strong}" }
      healthy: { surface: "{colors.success.soft}", value: "{colors.success.base}" }
      attention: { surface: "{colors.warning.soft}", value: "{colors.warning.strong}" }
    sizes:
      standard: { min_height: 92, padding: "{spacing.5}" }
    states: [default, hover, filtered]
    token_refs: [colors.paper, colors.accent.faint, colors.success.soft, colors.warning.soft]

  StatusPill:
    role: 用文本和语义色表达七种服务器任务状态
    variants:
      pending_review: { foreground: "{colors.ink.600}", background: "{colors.ink.100}" }
      pending: { foreground: "{colors.warning.strong}", background: "{colors.warning.soft}" }
      in_progress: { foreground: "{colors.accent.strong}", background: "{colors.accent.soft}" }
      completed: { foreground: "{colors.success.base}", background: "{colors.success.soft}" }
      accepted: { foreground: "{colors.accepted.base}", background: "{colors.accepted.soft}" }
      cancelled: { foreground: "{colors.danger.base}", background: "{colors.danger.soft}" }
      blocked: { foreground: "{colors.warning.strong}", background: "{colors.warning.soft}", border: "{colors.warning.base}" }
    sizes:
      compact: { height: 24, padding_x: "{spacing.3}", typography: "{typography.caption}" }
    states: [default, stale, conflict]
    token_refs: [colors.ink.100, colors.warning.soft, colors.accent.soft, colors.success.soft, colors.accepted.soft, colors.danger.soft]
    accessibility:
      requirement: 标签始终显示状态文本，颜色不作为唯一信息

  TaskTable:
    role: 展示确定性队列、完整状态列表和任务执行资格
    variants:
      queue: { header: "{colors.ink.50}", current_indicator: "{colors.accent.base}" }
      browser: { header: "{colors.ink.50}", selected: "{colors.accent.faint}" }
    sizes:
      dense: { row_height: "{layout.compact_row_height}", header_height: "{layout.control_height}", cell_padding_x: "{spacing.4}", typography: "{typography.body}" }
      standard: { row_height: "{layout.row_height}", header_height: "{layout.control_height}", cell_padding_x: "{spacing.5}", typography: "{typography.body}" }
    states: [loading, ready, empty, selected, stale, conflict, disabled]
    token_refs: [colors.ink.50, colors.ink.150, colors.accent.base, colors.accent.faint, typography.caption]
    accessibility:
      requirement: 可选行进入 Tab 顺序并支持 Enter 与 Space；选中、加载、冲突和禁用状态同时提供文本或可访问名称

  RuntimeStage:
    role: 投影同步、Controller、Worker、Gate 与写回的可理解阶段
    variants:
      idle: { indicator: "{colors.ink.300}", foreground: "{colors.ink.600}" }
      active: { indicator: "{colors.accent.base}", foreground: "{colors.ink.900}" }
      complete: { indicator: "{colors.success.base}", foreground: "{colors.success.base}" }
      failed: { indicator: "{colors.danger.base}", foreground: "{colors.danger.base}" }
    sizes:
      standard: { height: 44, gap: "{spacing.3}" }
    states: [idle, active, complete, failed, awaiting_human]
    token_refs: [colors.accent.base, colors.success.base, colors.danger.base, typography.caption]

  AttentionStrip:
    role: 提升必须由用户处理的人工事项但不自动打开 Chat
    variants:
      normal: { surface: "{colors.ink.50}", border: "{colors.ink.150}" }
      required: { surface: "{colors.warning.soft}", border: "{colors.warning.base}" }
      destructive: { surface: "{colors.danger.soft}", border: "{colors.danger.base}" }
    sizes:
      standard: { min_height: 52, padding: "{spacing.5}" }
    states: [empty, required, submitting, accepted, error]
    token_refs: [colors.warning.soft, colors.warning.base, colors.danger.soft, shadows.small]

  RecoveryCard:
    role: 展示远端与本地事实差异、冻结范围、责任方和恢复动作
    variants:
      warning: { surface: "{colors.warning.soft}", marker: "{colors.warning.base}" }
      critical: { surface: "{colors.danger.soft}", marker: "{colors.danger.base}" }
      informational: { surface: "{colors.info.soft}", marker: "{colors.info.base}" }
    sizes:
      standard: { padding: "{spacing.6}", radius: "{corner_radius.medium}" }
    states: [open, retrying, resolved, external_wait]
    token_refs: [colors.warning.soft, colors.danger.soft, colors.info.soft, corner_radius.medium]

  Button:
    role: 表达主操作、次操作、低风险导航和破坏操作
    variants:
      primary: { foreground: "{colors.paper}", background: "{colors.accent.base}", border: "{colors.accent.strong}" }
      secondary: { foreground: "{colors.ink.700}", background: "{colors.paper}", border: "{colors.ink.200}" }
      ghost: { foreground: "{colors.accent.strong}", background: transparent, border: transparent }
      destructive: { foreground: "{colors.paper}", background: "{colors.danger.base}", border: "{colors.danger.base}" }
    sizes:
      compact: { height: "{layout.compact_control_height}", padding_x: "{spacing.4}", typography: "{typography.label}" }
      standard: { height: 38, padding_x: "{spacing.5}", typography: "{typography.label}" }
    states: [default, hover, active, focus, disabled, busy]
    token_refs: [colors.accent.base, colors.danger.base, colors.ink.200, corner_radius.small, animation.fast]
    accessibility:
      focus: 2px 半透明紫色轮廓并保留 2px offset

  LoginGate:
    role: 在启动恢复和未登录状态建立轻量、聚焦且不可绕过的认证画布
    variants:
      restoring: { canvas: "{colors.ink.75}", glow: "{colors.accent.soft}", content: "{colors.ink.900}" }
      logged_out: { canvas: "{colors.ink.75}", glow: "{colors.accent.faint}", panel: "{colors.paper}" }
    sizes:
      desktop: { panel_width: 440, panel_padding: "{spacing.7}", radius: "{corner_radius.large}" }
    states: [restoring, logged_out, verification_sent, signing_in, error]
    token_refs: [colors.ink.75, colors.ink.50, colors.paper, colors.accent.soft, colors.accent.faint, colors.ink.900, corner_radius.large, shadows.large]
    accessibility:
      requirement: 浅色画布与正文保持 AA 对比度；进度与错误状态不只依赖颜色

  AccountPanel:
    role: 在独立认证页和设置覆盖层表达 Workshop 登录输入、会话状态与退出边界
    variants:
      logged_out: { surface: "{colors.paper}", status: "{colors.ink.500}", primary_action: "{colors.accent.base}" }
      verification_sent: { surface: "{colors.info.soft}", status: "{colors.info.base}", primary_action: "{colors.accent.base}" }
      authenticated: { surface: "{colors.success.soft}", status: "{colors.success.base}", primary_action: "{colors.info.base}" }
      expired: { surface: "{colors.danger.soft}", status: "{colors.danger.base}", primary_action: "{colors.accent.base}" }
    sizes:
      standard: { width: 560, padding: "{spacing.7}", field_height: 38, gap: "{spacing.5}" }
    states: [logged_out, sending_code, verification_sent, signing_in, authenticated, refreshing, expired, signing_out]
    token_refs: [colors.paper, colors.info.soft, colors.success.soft, colors.danger.soft, colors.accent.base, typography.body, corner_radius.medium, shadows.large]
    accessibility:
      requirement: 状态同时显示图标、文本和说明；错误紧邻表单；账号可脱敏但 token 永不显示

  ConversationSurface:
    role: 为 Chat 与 Automation Workbench 提供唯一共享的消息渲染、浏览和滚动视觉层级
    variants:
      chat: { surface: "{colors.paper}", composer: fixed, transcript_scroll: independent }
      review: { surface: "{colors.paper}", composer: hidden, transcript_scroll: independent }
      intervention: { surface: "{colors.paper}", composer: fixed, transcript_scroll: independent }
      reasoning_disclosure: { surface: transparent, foreground: "{colors.ink.600}", border: "{colors.ink.150}", typography: "{typography.body}", completed: collapsed }
      agent_message: { surface: transparent, foreground: "{colors.ink.900}", typography: "{typography.conversation}" }
      tool_activity: { surface: transparent, foreground: "{colors.ink.600}", typography: "{typography.caption}", overflow: ellipsis }
      approval_activity: { surface: "{colors.warning.soft}", foreground: "{colors.ink.900}", border: "{colors.warning.base}", typography: "{typography.caption}" }
      user_message: { surface: "{colors.accent.faint}", border: "{colors.accent.soft}", typography: "{typography.conversation}" }
    sizes:
      shell: { min_height: 0, left_pane: stable, center: flexible, inspector: "{layout.inspector_width}" }
      readable: { max_content_width: 760, message_padding: "{spacing.7}", tool_row_height: "{layout.compact_control_height}", typography: "{typography.conversation}" }
    states: [loading, chat, review, intervention, reasoning_streaming, reasoning_collapsed, approval_waiting, streaming, following_latest, history_position, submitting, accepted, error]
    token_refs: [colors.paper, colors.ink.150, colors.ink.600, colors.ink.900, colors.accent.faint, colors.accent.soft, colors.warning.soft, colors.warning.base, typography.caption, typography.conversation]
    accessibility:
      requirement: reasoning 使用原生可聚焦展开控件并提供可读标题；空 reasoning 不产生控件；工具与权限状态同时使用图标和文字；工具目标溢出时保留可访问全称；阅读历史时新消息不强制改变滚动位置

  AutomationExecutionOverview:
    role: 在 Workbench 侧栏一次展示完整执行时间、Gap 总数、逐 Gap 工作与 Automation 专属证据
    variants:
      summary: { surface: "{colors.ink.50}", foreground: "{colors.ink.900}", border: "{colors.ink.150}" }
      gap_completed: { indicator: "{colors.success.base}", foreground: "{colors.ink.700}" }
      gap_active: { indicator: "{colors.accent.base}", foreground: "{colors.ink.900}" }
      gap_waiting: { indicator: "{colors.warning.base}", foreground: "{colors.warning.strong}" }
      gap_failed: { indicator: "{colors.danger.base}", foreground: "{colors.danger.base}" }
    sizes:
      compact: { row_min_height: "{layout.row_height}", gap: "{spacing.3}", typography: "{typography.caption}" }
    states: [loading, running, awaiting_human, completed, interrupted, failed]
    token_refs: [colors.ink.50, colors.ink.150, colors.ink.700, colors.ink.900, colors.success.base, colors.accent.base, colors.warning.base, colors.warning.strong, colors.danger.base, typography.caption]
    accessibility:
      requirement: 完整时间、轮数与每个 Gap 状态均显示文本；颜色和图标不作为唯一信息；Gap 列表可键盘浏览并定位关联 Agent 消息
