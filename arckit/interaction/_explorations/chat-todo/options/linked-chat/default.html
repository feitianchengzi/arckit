<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat ↔ 待办 · 交互探索</title><link rel="stylesheet" href="../../../../../visual/_library/generated-tokens.css"><link rel="stylesheet" href="prototype.css"></head><body>
<nav><strong>ArcOrbit</strong><small>PERSONAL</small><span>Today</span><b>Chat</b><span>Thing</span><small>PRODUCT</small><span>Product</span><small>PRODUCT LIFECYCLE</small><span>Idea</span><span>Work</span><span>Automation</span><span>Release</span><span>Operations</span><span>Feedback</span><small>ORGANIZATION</small><span>Organization</span><span>Engineering</span></nav>
<div class="workspace"><header>ArcOrbit <span class="muted">本地交互样本</span></header><div class="layout"><main>
<div class="toolbar"><div><strong id="title"></strong><div id="relation" class="muted"></div></div><button id="whole">转为待办</button><button id="listToggle">会话</button></div>
<div id="messages" aria-label="对话消息"></div><div id="notice" role="status"></div>
<form id="composer"><textarea id="draft" aria-label="消息" placeholder="继续讨论，或说明你希望执行的内容…"></textarea><div class="tools"><button type="button" id="child">＋ 新建待办</button><span class="muted">Chat</span><select id="intent" aria-label="发送意图"><option>分析</option><option>执行</option></select><button class="primary" id="send">发送</button></div></form>
</main><aside id="sessions"><div class="tools"><strong>对话</strong><button id="new">＋ 新对话</button></div><button id="existing">选择已有待办…</button><small>ArcOrbit</small><div id="sessionRows"></div></aside></div>
<details class="preview"><summary>旧版表单方案 · 未采纳</summary><p><a href="../agent-native/default.html">打开当前 Agent 原生交互候选 →</a></p><label><input type="checkbox" id="fail"> 下次创建失败</label> <button id="reset">重置样本</button><p>试用：标题右侧整体转待办；消息下方或输入框新建待办；右侧选择已有待办。侧栏其他页面仅为定位背景。</p></details></div>
<dialog id="dialog" aria-labelledby="dialogTitle"></dialog><script src="prototype.js"></script></body></html>
