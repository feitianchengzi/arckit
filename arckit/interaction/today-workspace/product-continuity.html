<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>Today 产品续接</title><link rel="stylesheet" href="../wireframe-style.css"></head><body><div class="wireframe-container">
<details open><summary>消息和本机续接</summary><p>触发条件：存在反馈未读或本机未完成资料。</p><div class="wireframe-canvas"><div class="device-frame desktop"><div class="pane-toolbar"><strong>Today</strong><button>添加 Idea</button></div><div class="pane-body"><section class="form-section"><h2>需要你处理 / 项目配置</h2><p>既有责任工作台保持可操作。</p></section><section class="form-section"><h2>新消息</h2><button>打开 Feedback 中的未读消息</button></section><section class="form-section"><h2>继续整理</h2><button>Demo Idea · 接入待核对</button><button>产品资料 · 尚未共享</button></section></div></div></div><div class="component-list"><h3>组件清单</h3><p>添加入口、来源消息、本机草稿。</p></div><div class="interactions"><h3>交互行为</h3><p>选择后进入来源对象，成功读取才改变未读。</p></div></details>
<details><summary>补充来源不可用</summary><p>触发条件：反馈读取失败。</p><div class="wireframe-canvas"><div class="device-frame desktop"><div class="pane-body"><p>消息暂时无法确认 · 重试</p><button>继续本机 Idea</button><p>原责任台独立工作。</p></div></div></div><div class="component-list"><h3>组件清单</h3><p>失败原因、保留记录和重试。</p></div><div class="interactions"><h3>交互行为</h3><p>不将未知消息数量显示成全部已读。</p></div></details>
</div></body></html>
