<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat 原型场景工具</title>
<style>body{margin:0;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}iframe{width:100%;height:calc(100dvh - 95px);border:0}select,button{font:inherit;padding:8px}</style></head>
<body><header><strong>本地模拟 · 不连接 Codex 或业务服务</strong><select id="scenario"><option value="empty">无历史会话</option><option value="offline">离线</option><option value="failure">下次提交失败</option><option value="permission">权限请求</option><option value="failed">运行失败</option><option value="no-workspace">没有可用工作区</option><option value="long">长消息与代码</option><option value="catalog">模型清单不可用</option><option value="native-failure">下次原生写入失败</option><option value="native-conflict">当前待办版本变化</option><option value="native-occupied">当前待办执行占用</option><option value="native-unavailable">当前待办失权</option><option value="native-reset">恢复待办访问与写入</option><option value="recover">恢复</option><option value="reset">重置</option></select><button id="apply">应用场景</button></header><iframe title="Chat 完整原型" src="default.html?scenarioTools=on"></iframe><script src="scenario-controls.js"></script></body></html>
