name: Manual ArcOrbit Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tf/vx.x.x-bN, beta/vx.x.x-rcN, or appstore/vx.x.x tag
        required: true
        type: string
      target:
        description: Installer target
        required: true
        default: macos-arm64
        type: choice
        options: [macos-arm64, macos-x64, windows-x64, linux-x64, all]
      signing:
        description: macOS signing/notarization gate; Windows and Linux remain unsigned
        required: true
        default: required
        type: choice
        options: [required, auto, disabled]
      publish:
        description: Actions artifact only or attach to a draft release
        required: true
        default: artifact-only
        type: choice
        options: [artifact-only, draft-release]
      arcforge_repository:
        description: ArcForge GitHub owner/repository
        required: true
        default: feitianchengzi/arcforge
        type: string
      arcforge_release:
        description: Exact existing ArcForge provider release tag
        required: true
        type: string
      arcforge_sha256:
        description: Expected provider .tgz SHA-256
        required: true
        type: string
      allow_main_beta:
        description: Explicitly accept beta from main when release/vx.x.x does not exist
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: arcorbit-package-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release and provider inputs
    runs-on: ubuntu-latest
    outputs:
      product_version: ${{ steps.contract.outputs.product_version }}
      package_version: ${{ steps.contract.outputs.package_version }}
      channel: ${{ steps.contract.outputs.channel }}
      commit: ${{ steps.contract.outputs.commit }}
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Fetch governed refs
        run: git fetch origin main 'refs/heads/release/*:refs/remotes/origin/release/*' 'refs/tags/*:refs/tags/*' --force

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runtime/arcorbit/package-lock.json

      - run: npm ci
        working-directory: runtime/arcorbit

      - id: contract
        name: Validate immutable tag, commit, version, and baseline
        working-directory: runtime/arcorbit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALLOW_MAIN_BETA: ${{ inputs.allow_main_beta }}
        run: node scripts/validate-release-trigger.mjs --tag "$RELEASE_TAG" --allow-main-beta "$ALLOW_MAIN_BETA" --github-output "$GITHUB_OUTPUT"

      - name: Run checks with a virtual display
        run: xvfb-run --auto-servernum npm run check
        working-directory: runtime/arcorbit

      - id: selection
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            macos-arm64) matrix='[{"name":"macOS Apple Silicon","os":"macos-15","platform":"mac","target":"macos-arm64","script":"package:mac:arm64"}]' ;;
            macos-x64) matrix='[{"name":"macOS Intel","os":"macos-15-intel","platform":"mac","target":"macos-x64","script":"package:mac:x64"}]' ;;
            windows-x64) matrix='[{"name":"Windows x64","os":"windows-latest","platform":"win","target":"windows-x64","script":"package:win:x64"}]' ;;
            linux-x64) matrix='[{"name":"Linux x64","os":"ubuntu-latest","platform":"linux","target":"linux-x64","script":"package:linux:x64"}]' ;;
            all) matrix='[{"name":"macOS Apple Silicon","os":"macos-15","platform":"mac","target":"macos-arm64","script":"package:mac:arm64"},{"name":"macOS Intel","os":"macos-15-intel","platform":"mac","target":"macos-x64","script":"package:mac:x64"},{"name":"Windows x64","os":"windows-latest","platform":"win","target":"windows-x64","script":"package:win:x64"},{"name":"Linux x64","os":"ubuntu-latest","platform":"linux","target":"linux-x64","script":"package:linux:x64"}]' ;;
            *) echo "Unsupported target: $TARGET" >&2; exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Download exact ArcForge provider release
        env:
          GH_TOKEN: ${{ secrets.ARCFORGE_READ_TOKEN || github.token }}
          ARCFORGE_REPOSITORY: ${{ inputs.arcforge_repository }}
          ARCFORGE_RELEASE: ${{ inputs.arcforge_release }}
        run: |
          set -euo pipefail
          mkdir provider-input
          gh release download "$ARCFORGE_RELEASE" --repo "$ARCFORGE_REPOSITORY" --pattern 'arcforge-provider-*.tgz' --pattern 'arcforge-provider.manifest.json' --dir provider-input
          test "$(find provider-input -maxdepth 1 -name 'arcforge-provider-*.tgz' -type f | wc -l | tr -d ' ')" = 1
          test -f provider-input/arcforge-provider.manifest.json

      - name: Verify provider digest before fan-out
        shell: bash
        env:
          EXPECTED_SHA256: ${{ inputs.arcforge_sha256 }}
        run: |
          set -euo pipefail
          archive="$(find provider-input -maxdepth 1 -name 'arcforge-provider-*.tgz' -type f -print -quit)"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$actual" == "$EXPECTED_SHA256" ]] || { echo "Provider SHA-256 mismatch." >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: verified-arcforge-provider-${{ github.run_id }}
          path: provider-input/*
          if-no-files-found: error

  package:
    name: ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    environment: ${{ needs.validate.outputs.channel == 'tf' && 'internal' || needs.validate.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runtime/arcorbit/package-lock.json

      - run: npm ci
        working-directory: runtime/arcorbit

      - uses: actions/download-artifact@v4
        with:
          name: verified-arcforge-provider-${{ github.run_id }}
          path: provider-input

      - name: Prepare macOS notarization API key
        if: inputs.signing != 'disabled' && matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$APPLE_API_KEY_BASE64" ]]; then
            api_key_path="$RUNNER_TEMP/AuthKey_ArcOrbit.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
            grep -q '^-----BEGIN PRIVATE KEY-----$' "$api_key_path"
            grep -q '^-----END PRIVATE KEY-----$' "$api_key_path"
            chmod 600 "$api_key_path"
            echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          fi

      - id: signing
        name: Enforce operator-selected signing gate
        shell: bash
        env:
          MODE: ${{ inputs.signing }}
          PLATFORM: ${{ matrix.platform }}
          MAC_CSC_LINK: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_BASE64 == '' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_BASE64 == '' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          notarize=false
          notarization_auth=none
          signing_result=disabled
          effective_signing=disabled
          if [[ "$PLATFORM" == mac ]]; then
            effective_signing="$MODE"
            if [[ "$MODE" != disabled ]]; then signing_result=unsigned-allowed; fi
            if [[ "$PLATFORM" == mac && -n "$MAC_CSC_LINK" && -n "$MAC_CSC_KEY_PASSWORD" ]]; then signing_result=signed; fi
            if [[ "$PLATFORM" == mac && -n "${APPLE_API_KEY:-}" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" && -n "$APPLE_TEAM_ID" ]]; then
              notarize=true
              notarization_auth=api-key
            elif [[ "$PLATFORM" == mac && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              notarize=true
              notarization_auth=apple-id
            fi
          elif [[ "$PLATFORM" == linux ]]; then
            signing_result=not-applicable
          fi
          if [[ "$MODE" == required && "$PLATFORM" == mac && "$signing_result" != signed ]]; then echo 'required macOS signing secrets are missing' >&2; exit 1; fi
          if [[ "$MODE" == required && "$PLATFORM" == mac && "$notarize" != true ]]; then echo 'required macOS notarization secrets are missing' >&2; exit 1; fi
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
          echo "signing_result=$signing_result" >> "$GITHUB_OUTPUT"
          echo "notarization_auth=$notarization_auth" >> "$GITHUB_OUTPUT"
          echo "effective_signing=$effective_signing" >> "$GITHUB_OUTPUT"
          if [[ "$PLATFORM" == mac ]]; then
            echo "macOS notarization authentication: $notarization_auth"
          fi

      - name: Assemble verified distribution resources
        working-directory: runtime/arcorbit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PROVIDER_SHA256: ${{ inputs.arcforge_sha256 }}
          PROVIDER_RELEASE: ${{ inputs.arcforge_release }}
          PROVIDER_REPOSITORY: ${{ inputs.arcforge_repository }}
          TARGET: ${{ matrix.target }}
          SIGNING: ${{ steps.signing.outputs.effective_signing }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          archive="$(find ../../provider-input -maxdepth 1 -name 'arcforge-provider-*.tgz' -type f -print -quit)"
          node scripts/prepare-distribution.mjs --release-tag "$RELEASE_TAG" --provider-archive "$archive" --provider-manifest ../../provider-input/arcforge-provider.manifest.json --provider-sha256 "$PROVIDER_SHA256" --provider-release "$PROVIDER_RELEASE" --provider-repository "$PROVIDER_REPOSITORY" --target "$TARGET" --signing "$SIGNING" --source-commit "$SOURCE_COMMIT" --repository "$REPOSITORY" --workflow "$WORKFLOW" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --source-ref "$SOURCE_REF"
          node scripts/build-package-config.mjs --signing "$SIGNING" --notarize '${{ steps.signing.outputs.notarize }}' --platform '${{ matrix.platform }}'

      - name: Smoke-test packaged provider and skill payload
        working-directory: runtime/arcorbit
        run: npm run smoke:distribution

      - name: Build installer
        working-directory: runtime/arcorbit
        env:
          CSC_LINK: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.effective_signing == 'disabled' && 'false' || 'true' }}
          APPLE_API_KEY_ID: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_BASE64 == '' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_BASE64 == '' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signing != 'disabled' && matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run ${{ matrix.script }}

      - name: Verify macOS signature
        if: steps.signing.outputs.signing_result == 'signed' && matrix.platform == 'mac'
        working-directory: runtime/arcorbit
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find release -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Verify macOS notarization
        if: steps.signing.outputs.notarize == 'true' && matrix.platform == 'mac'
        working-directory: runtime/arcorbit
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find release -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Verify Windows signature
        if: steps.signing.outputs.signing_result == 'signed' && matrix.platform == 'win'
        working-directory: runtime/arcorbit
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Windows signature is $($signature.Status)" }

      - name: Finalize artifact attestations
        working-directory: runtime/arcorbit
        shell: bash
        run: |
          set -euo pipefail
          notarization_result=not-requested
          if [[ '${{ steps.signing.outputs.notarize }}' == true ]]; then
            notarization_result=verified-by-platform-gate
          fi
          node scripts/finalize-package-artifacts.mjs --signing-result '${{ steps.signing.outputs.signing_result }}' --notarization-result "$notarization_result"

      - uses: actions/upload-artifact@v4
        with:
          name: arcorbit-${{ matrix.target }}-${{ needs.validate.outputs.package_version }}
          path: |
            runtime/arcorbit/release/*.dmg
            runtime/arcorbit/release/*.exe
            runtime/arcorbit/release/*.AppImage
            runtime/arcorbit/release/checksums.txt
            runtime/arcorbit/release/attestations/*
          if-no-files-found: error

  publish:
    name: Attach installers to draft release
    needs: [validate, package]
    if: inputs.publish == 'draft-release' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: arcorbit-*
          path: release-assets

      - name: Prepare unique release assets
        shell: bash
        run: node runtime/arcorbit/scripts/prepare-release-assets.mjs --root release-assets

      - name: Create or update draft without moving the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ needs.validate.outputs.product_version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f -print0 | sort -z)
          if [[ "${#files[@]}" -eq 0 ]]; then echo 'No installer assets found.' >&2; exit 1; fi
          if gh release view "$TAG" --json isDraft --jq .isDraft >/tmp/is-draft 2>/dev/null; then
            [[ "$(cat /tmp/is-draft)" == true ]] || { echo "Refusing to mutate published release $TAG" >&2; exit 1; }
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            prerelease=()
            if [[ "$CHANNEL" != appstore ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" "${files[@]}" --verify-tag --draft "${prerelease[@]}" --title "ArcOrbit $VERSION ($CHANNEL)" --generate-notes
          fi
