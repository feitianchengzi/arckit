<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>链路演示 — 产品支持链路设计稿</title>
    <link rel="stylesheet" href="../../../../../runtime/arcorbit/desktop/renderer/styles.css">
    <link rel="stylesheet" href="./prototype.css">
  </head>
  <body data-page="demo">
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></symbol>
      <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M5 5.5h14v10H9l-4 3v-13Z"></path><path d="M8 9h8M8 12h5"></path></symbol>
      <symbol id="icon-work" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path><circle cx="7" cy="6" r="1"></circle><circle cx="7" cy="12" r="1"></circle><circle cx="7" cy="18" r="1"></circle></symbol>
      <symbol id="icon-automation" viewBox="0 0 24 24"><path d="M7 4h10l3 8-3 8H7l-3-8 3-8Z"></path><circle cx="12" cy="12" r="3"></circle></symbol>
      <symbol id="icon-feedback" viewBox="0 0 24 24"><path d="M5 5h14v11H9l-4 3V5Z"></path><path d="M8 9h8M8 12h6"></path></symbol>
      <symbol id="icon-organization" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M3 20c.4-4 2.1-6 5-6s4.6 2 5 6M14 20c.2-2.7 1.3-4.2 3.4-4.2 2 0 3.2 1.4 3.6 4.2"></path></symbol>
      <symbol id="icon-sync" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"></path><path d="M6.2 8A7 7 0 0 1 18.8 7M17.8 16A7 7 0 0 1 5.2 17"></path></symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M12 4 3.5 19h17L12 4Z"></path><path d="M12 9v4M12 16h.01"></path></symbol>
    </svg>

    <!-- 内部工作台外壳（复用 02 结构）-->
    <div class="desktop-app">
      <header class="titlebar">
        <div class="sync-state"><i></i><span>链路演示</span></div>
        <div class="titlebar-drag">ArcOrbit · Demo</div>
        <div class="window-controls"></div>
      </header>
      <aside class="sidebar">
        <div class="sidebar-brand"><span class="brand-mark">A</span><strong>ArcOrbit</strong></div>
        <nav class="primary-nav" id="primaryNav" aria-label="主导航"></nav>
        <div class="sidebar-footer">
          <button class="profile-button" type="button"><span class="account-avatar brand-mark">张</span><strong>张三</strong><small>处理人</small></button>
        </div>
      </aside>
      <main class="app-stage">
        <header class="commandbar">
          <div class="breadcrumbs"><strong id="scopeTitle">所有项目</strong><span id="pageTitle">今日待处理</span></div>
          <div class="commandbar-actions">
            <div class="product-set-cluster" aria-label="产品集与观察范围">
              <label class="workset-control"><span>产品集</span><select id="worksetSelect" aria-label="当前产品集"></select></label>
              <label class="product-scope-control"><span>查看</span><select id="productScopeSelect" aria-label="产品观察范围"></select></label>
              <button id="editWorksetButton" class="product-set-manage" type="button" title="管理当前产品集">管理</button>
            </div>
            <label class="automation-toggle" title="控制是否领取新任务"><input id="automationEnabled" type="checkbox"><span></span><strong>自动领取</strong></label>
            <button class="icon-button" type="button" title="同步" aria-label="同步"><svg class="ui-icon" aria-hidden="true"><use href="#icon-sync"></use></svg></button>
          </div>
        </header>
        <div class="view-host">
          <section class="app-view" data-page-view="today" id="viewToday"></section>
          <section class="app-view" data-page-view="feedback" id="viewFeedback"></section>
          <section class="app-view" data-page-view="work" id="viewWork"></section>
          <section class="app-view" data-page-view="command" id="viewCommand"></section>
          <section class="app-view" data-page-view="workbench" id="viewWorkbench"></section>
          <section class="app-view" data-page-view="recovery" id="viewRecovery"></section>
          <section class="app-view" data-page-view="organization" id="viewOrg"></section>
        </div>
      </main>
    </div>

    <!-- 客户端 SDK 外壳（复用 01 结构）-->
    <div id="sdkStage">
      <div id="app" class="prototype-root"></div>
    </div>

    <!-- 演示控制条 -->
    <div id="demoBar">
      <div class="demo-controls">
        <button data-demo-reset type="button" title="重置">⟲</button>
        <button data-demo-prev type="button" title="上一步">⏮</button>
        <button class="primary" data-demo-play type="button" title="播放/暂停">▶ 播放</button>
        <button data-demo-next type="button" title="下一步">⏭</button>
      </div>
      <div class="demo-step-info">
        <span class="demo-step-idx">0 / 15</span>
        <span class="demo-step-title">准备开始</span>
        <span class="demo-step-desc">点击播放或下一步，开始串演客户支持链路。</span>
        <div class="demo-progress"><div class="demo-progress-fill" style="width:0%"></div></div>
      </div>
      <div class="demo-step-chips" id="demoChips"></div>
    </div>

    <div id="modalRoot"></div>
    <script src="./prototype.js"></script>
    <script>
      // 04 页初始化：渲染步骤芯片 + 重置演示
      function renderDemoChips() {
        const chips = document.getElementById('demoChips');
        if (!chips) return;
        chips.innerHTML = DEMO_SCRIPT.map((s, i) => {
          let cls = '';
          if (i < demoStep) cls = 'is-done';
          else if (i === demoStep) cls = 'is-current';
          return `<button class="${cls}" data-demo-jump="${i}" type="button" title="${s.title}"></button>`;
        }).join('');
      }
      // 重写 demoUpdateBar 以同时更新芯片
      const _origUpdateBar = demoUpdateBar;
      demoUpdateBar = function() { _origUpdateBar(); renderDemoChips(); };
      // 初始化
      document.addEventListener('DOMContentLoaded', () => { demoReset(); });
      if (document.readyState !== 'loading') demoReset();
    </script>
  </body>
</html>
