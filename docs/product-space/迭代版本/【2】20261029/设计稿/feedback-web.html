function seeded(i){if(i.fields)return [];return [{who:'我',time:i.date+' 14:20',text:i.summary,screen:i.id==='FB-1028'},{who:'智能客服',time:'14:22',text:i.type==='Bug'?'已完成问题结构化收集，经你确认后创建反馈卡片。':'已收集目标用户、场景、业务目标与替代方案，确认后提交内部需求分析。'},{who:'陈予 · 产品支持',time:i.updated+' 09:42',text:i.status==='处理中'?'已复现项目权限同步异常，正在修复。请先让组织管理员协助导出。':i.status==='待验收'?'批量导出已在 Web 2.8.0 交付，请查看交付说明，体验后告诉我们结果。':i.status==='暂不采纳'?'当前先保持统一导出格式，此需求暂不采纳。原因与替代方案已记录在处理结论中，可继续补充业务依据。':i.status==='评估中'?'我们正在评估使用频率与实现约束。请补充接收周报的角色和数据范围。':i.status==='已解决'?'修复已交付，感谢你完成验证。':'已收到反馈，等待团队受理。'}]}
function history(i){return [...seeded(i),...(messages[i.id]||[])]}function matched(){return items.filter(i=>(filter==='全部'||i.status===filter)&&(!query||[i.id,i.title,i.summary,...history(i).map(m=>m.text)].join(' ').toLowerCase().includes(query.toLowerCase()))&&(range!=='7'||i.date>='2026-10-23')&&(range!=='30'||i.date>='2026-09-30')&&(range!=='custom'||(!from||i.date>=from)&&(!to||i.date<=to)))}
function renderList(){const list=matched();$('content').innerHTML=`<div class="row"><div><h2 style="font-size:20px">我的反馈</h2><small>查看处理进展，与团队继续沟通。</small></div></div><div class="toolbar"><div class="search"><span>⌕</span><input id="search" aria-label="搜索反馈" placeholder="搜索问题、编号或沟通" value="${esc(query)}"></div><select id="range" aria-label="时间筛选" onchange="range=this.value;render()"><option value="all">全部时间</option><option value="7">最近7天</option><option value="30">最近30天</option><option value="custom">自定义日期</option></select></div><div class="datebar ${range==='custom'?'show':''}"><label>从 <input type="date" value="${from}" onchange="from=this.value;render()"></label><label>至 <input type="date" value="${to}" onchange="to=this.value;render()"></label></div><div class="row" style="margin-bottom:16px;align-items:flex-start"><div class="chips">${['全部','待受理','处理中','待验收','已解决'].map(s=>`<button class="chip ${s===filter?'active':''}" onclick="filter='${s}';limit=4;render()">${s}</button>`).join('')}</div><button class="hint-action" style="font-size:11px;white-space:nowrap" onclick="query='';range='all';from='';to='';filter='全部';render()">重置</button></div><small style="display:block;margin-bottom:12px">${list.length} 条反馈 · 按提交时间排序</small><div class="list">${list.slice(0,limit).map(i=>`<button class="item" onclick="openFeedback('${i.id}')"><div class="row"><small>${i.id} · ${i.type} ${i.unread?'<span class="dot"></span>':''}</small>${status(i.status)}</div><h3>${esc(i.title)}</h3><p>${esc(i.summary)}</p><div class="row" style="margin-top:12px"><small>提交 ${i.date}</small><small>${i.unread?'团队有新回复':'查看详情'} →</small></div></button>`).join('')||'<div class="empty">未找到匹配反馈<br><small>可调整关键词、时间或状态。</small></div>'}${list.length>limit?'<button class="btn" onclick="limit+=4;render()">加载更多</button>':''}</div>`;$('range').value=range;$('search').addEventListener('input',e=>{query=e.target.value;const pos=e.target.selectionStart;renderList();$('search').focus();$('search').setSelectionRange(pos,pos)})}
function openFeedback(id){if($('draft'))draft=$('draft').value;stopRecording(false);draft='';attachments=[];audioDraft=false;view='feedback';selected=id;tab='沟通记录';const i=items.find(x=>x.id===id);i.unread=false;save();render();$('content').scrollTop=0}
function switchTab(t){if($('draft'))draft=$('draft').value;stopRecording(false);tab=t;render()}
function renderDetail(){const i=items.find(x=>x.id===selected);$('content').innerHTML=`<div class="backline"><button class="widget-back" onclick="selected=null;render()">← 我的反馈</button><small>${i.id} · ${i.type}</small></div><div class="detail-head"><div class="row"><h2>${esc(i.title)}</h2>${status(i.status)}</div><div class="meta">提交 ${i.date} · 最近沟通 ${i.updated}</div><div class="tabs">${['沟通记录','卡片流转','处理结论'].map(t=>`<button class="tab ${tab===t?'active':''}" onclick="switchTab('${t}')">${t}</button>`).join('')}</div></div><div class="pane">${tab==='沟通记录'?`<div class="notice">内部人员的回复和你的补充，都会保留在当前卡片中；无需重新提交反馈。</div><button class="hint-action" onclick="infoModal()">▤ 查看已提交的${i.type==='Bug'?'问题结构化信息':'需求分析信息'} →</button>${history(i).map(bubble).join('')}`:tab==='卡片流转'?flow(i):conclusion(i)}</div>`;if(tab==='沟通记录'){$('composer-root').innerHTML=composer();$('draft').value=draft;updatePreviews()}}
function flow(i){const pending=i.status==='待受理';return `<div class="feedback-state">从提交到验收，查看当前卡片的客户可见流转记录。内部任务与私密讨论不向客户展开。</div><div class="timeline"><div class="event"><small>${i.date}</small><h3>信息收集完成 · 客户确认提交</h3><p>${i.type==='Bug'?'问题现象、期望、复现条件与影响已整理':'目标用户、场景、业务目标和当前替代方式已整理'}，原咨询及附件已关联。</p></div><div class="event"><small>${pending?'当前阶段':i.date}</small><h3>${pending?'待受理':'内部团队受理'}</h3><p>${pending?'尚未确定方案与排期，仍可继续补充。':i.type==='Bug'?'已进入问题复现与定位。':'已进入需求价值与可行性分析。'}</p></div>${!pending?`<div class="event"><small>${i.updated} · 当前进展</small><h3>${i.status==='处理中'?'已复现 → 修复中':i.status==='评估中'?'分析评估中':i.status==='暂不采纳'?'评估完成 → 暂不采纳':'实现完成 → 已交付'}</h3><p>${i.status==='处理中'?'修复结果将通过原反馈渠道通知。':i.status==='评估中'?'如需更多信息，内部人员会在沟通记录中向你询问。':i.status==='暂不采纳'?'决定依据可在处理结论查看；可补充新信息请求复核。':'适用版本与验证步骤见处理结论。'}</p></div>`:''}${['已解决','待验收'].includes(i.status)?`<div class="event"><small>${i.status==='已解决'?'客户已确认':'等待客户反馈'}</small><h3>${i.status==='已解决'?'验收通过 → 已解决':'待验收'}</h3><p>${i.status==='已解决'?'完整沟通及结论继续保留，可追加新情况。':'请验证交付结果；若仍有问题，在原卡片继续补充。'}</p></div>`:''}</div>`}
function conclusion(i){if(['待受理','评估中','处理中'].includes(i.status))return '<div class="empty"><div style="font-size:30px;margin-bottom:10px">◷</div><h3 style="color:var(--text)">尚无正式处理结论</h3><p style="margin:12px 0">收集完成不代表已接受需求或承诺交付。<br>团队处理后，结论会在这里更新。</p><button class="btn" onclick="switchTab(\'沟通记录\')">继续沟通</button></div>';const rejected=i.status==='暂不采纳';return `<div class="result"><div class="row"><span class="status ${rejected?'gray':'green'}">${rejected?'评估结论':'正式交付'}</span><small>人工发布 · v1</small></div><h3>${rejected?'本次暂不采纳':i.type==='Bug'?'问题已修复':'批量导出能力已交付'}</h3><p>${rejected?'当前优先维护统一报表格式，暂不增加自定义字段。可先导出完整表格，再在表格工具内选择字段。若有更具体的业务影响，欢迎补充以供复核。':'已完成处理，请按下方步骤验证；若仍有异常，请继续在原卡片补充。'}</p>${!rejected?'<button class="btn" onclick="delivery()">查看交付说明 ↗</button>':''}</div><dl class="facts"><dt>发布人</dt><dd>陈予 · 产品支持</dd><dt>发布时间</dt><dd>${i.updated}</dd><dt>${rejected?'替代方案':'适用版本'}</dt><dd>${rejected?'导出完整报表后筛选字段':'Web 2.8.0 及以上'}</dd>${!rejected?'<dt>验证步骤</dt><dd>刷新产品 → 重复原操作 → 核对结果</dd>':''}<dt>结论依据</dt><dd><button class="source-link" onclick="infoModal()">原问题、收集信息与处理沟通 →</button></dd></dl><div class="inline-actions">${i.status==='待验收'?'<button class="btn primary" onclick="confirmSolved()">确认已解决</button>':''}<button class="btn" onclick="continueFeedback()">${rejected?'补充信息，请求复核':'仍有问题，继续补充'}</button></div><div class="version"><button class="hint-action" onclick="versionModal()">查看结论版本记录 →</button></div>`}
function continueFeedback(){switchTab('沟通记录');draft='补充说明：';$('draft').value=draft;$('draft').focus();toast('将追加到同一卡片，由内部团队继续沟通')}
function confirmSolved(){modal('<h2>确认已解决？</h2><p>请先验证交付结果。确认后卡片保留全部生命周期记录。</p><footer><button class="btn" onclick="closeModal()">暂不确认</button><button class="btn primary" onclick="finishSolved()">确认验收</button></footer>')}
function finishSolved(){const i=items.find(x=>x.id===selected);i.status='已解决';(messages[i.id]??=[]).push({who:'我',text:'已验证，确认解决。',time:'刚刚'});save();closeModal();render();toast('已记录客户验收，卡片更新为已解决')}
function infoModal(){const i=items.find(x=>x.id===selected),f=i.type==='一般反馈'?manualFields:i.type==='Bug'?bugFields:featureFields;modal(`<h2>${i.type==='Bug'?'问题结构化信息':'需求分析信息'}</h2><p class="muted">客户确认后提交。原始附件、咨询及补充记录一并保留。</p><dl class="facts">${f.map(([k,label])=>`<dt>${label}</dt><dd>${esc(i.fields?.[k]||(k==='actual'||k==='pain'?i.summary:k==='module'?'数据报表':'历史示例 · 详见沟通记录'))}</dd>`).join('')}</dl><footer><button class="btn" onclick="closeModal()">关闭</button></footer>`)}
function sourceModal(){modal('<h2>仓库知识依据</h2><span class="tag">模拟来源，不读取真实仓库</span><h3 style="margin:20px 0 10px">docs/reports.md · 导出说明</h3><div class="source-note">进入数据报表，选择月份与项目，点击导出。项目成员需具备相应导出权限。</div><p class="muted" style="margin-top:15px">正式服务应记录项目、仓库版本、文件与引用片段。没有可靠依据时继续澄清，不编造答案。</p><footer><button class="btn" onclick="closeModal()">返回咨询</button></footer>')}
function delivery(){modal('<h2>交付说明 · Web 2.8.0</h2><p class="muted">示例交付内容</p><p style="margin:18px 0">本次更新完成原反馈对应的处理。请刷新产品，在原业务场景中重新操作。</p><h3>验证步骤</h3><p>1. 登录原账号<br>2. 重复原操作<br>3. 核对结果<br>4. 返回反馈确认，或继续补充问题</p><footer><button class="btn primary" onclick="closeModal()">返回反馈</button></footer>')}
function versionModal(){modal('<h2>结论版本</h2><div class="event" style="margin-top:25px"><small>当前 · v1</small><h3>内部团队发布处理结论</h3><p>陈予 · 产品支持<br>结论关联原卡片、证据与交付信息。</p></div><p class="muted">后续修订会保留旧版本及修改原因，不覆盖原始记录。</p><footer><button class="btn" onclick="closeModal()">关闭</button></footer>')}
function modal(html){$('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" tabindex="-1">${html}</section></div>`;$('overlay').querySelector('.modal').focus()}function closeModal(){$('overlay').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function showImage(src){modal(`<div class="row"><h2>原始图片</h2><button class="btn" onclick="closeModal()">关闭 ×</button></div>${src?`<img src="${esc(src)}" style="max-width:100%;margin-top:15px" alt="原始图片">`:'<div class="source-note" style="margin-top:15px"><h3>云协作 · 月度报表</h3><div class="screen-error" style="padding:35px;font-size:16px">403 Forbidden<br>当前账号没有操作权限</div><small>演示截图</small></div>'}<p class="muted" style="margin-top:15px">该图片保留在原咨询与反馈卡片中，用于复核。</p>`)}
$('file').onchange=async e=>{for(const f of [...e.target.files]){if(attachments.length>=4){toast('每轮最多4张图片');break}if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>10485760){toast('支持JPG、PNG、WebP，单张不超过10MB');continue}const src=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)});attachments.push({name:f.name,src})}e.target.value='';updatePreviews()};
function updatePreviews(){if(!$('previews'))return;$('previews').innerHTML=attachments.map((a,i)=>`<div class="preview"><img src="${esc(a.src)}" alt="待发送图片"><div>${esc(a.name)} <button aria-label="移除图片" onclick="attachments.splice(${i},1);updatePreviews()">×</button></div></div>`).join('')+(audioDraft?'<div class="recorded">♩ 模拟语音已准备 <button onclick="audioDraft=false;updatePreviews()">×</button></div>':'')}
function startRecording(){if(recordTimer)return;seconds=0;$('record-area').innerHTML='<div class="recording"><span>语音转文字 · 交互演示</span><strong id="seconds">00:00</strong><span style="flex:1"></span><button onclick="stopRecording(false)">取消</button><button class="btn" onclick="stopRecording(true)">停止并转文字</button></div>';toast('原型不采集真实声音；完成后填入明确标识的示例文字，不自动发送');recordTimer=setInterval(()=>{seconds++;if($('seconds'))$('seconds').textContent='00:'+String(seconds).padStart(2,'0');if(seconds>=60)stopRecording(true)},1000)}function stopRecording(keep){if(!recordTimer)return;clearInterval(recordTimer);recordTimer=null;if($('record-area'))$('record-area').innerHTML='';if(keep){draft=($('draft')?.value||draft)+(draft?'\n':'')+'【语音转写示例，请编辑后发送】导出报表时出现错误。';if($('draft'))$('draft').value=draft;toast('文字已填入输入框，请核对后点击发送')}}function scrollBottom(){requestAnimationFrame(()=>$('content').scrollTop=$('content').scrollHeight)}
render();
</script></body></html>
