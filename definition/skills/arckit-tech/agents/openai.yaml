interface:
  display_name: "ArcKit Tech"
  short_description: "维护稳定技术方案、架构边界、模型和契约"
  default_prompt: "使用 $arckit-tech 查询、创建、更新或审计 arckit/tech 下的稳定技术事实。先读取 INDEX 并判断查询或变更；只接收用户、Controller worker report、实现证据、稳定事实源或 external adapter 提供的明确材料。未解决权衡保留在 active case 的 open_questions，外部事项写入 pending_handoffs，需要人类取舍时标记 human_decision_required。最终输出 document_scope。"
policy:
  allow_implicit_invocation: true
workflow:
  first_steps:
    - "读取 arckit/tech/INDEX.md 并判断查询或变更。"
    - "变更时先做技术域归属、体积和 source/projection 分析。"
    - "只把稳定架构、数据模型、API 契约和技术约束写入事实源。"
  boundaries:
    - "本能力可由 Runtime 绑定给 Worker，但只能在 packet 的 allowed_skills、allowed_paths 和事实边界内执行。"
    - "不把未确认权衡、产品决策、排期或完整实现代码写入技术事实。"
    - "不依赖已移除 skill；开放问题、待处理 handoff 和 human gate 保留在 active case。"
  output:
    - "document_scope"
