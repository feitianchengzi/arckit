<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_NAME}} · 交互原型</title>
  <link rel="stylesheet" href="{{WIREFRAME_CSS_HREF}}">
  <link rel="stylesheet" href="prototype.css">
  <script src="prototype.js" defer></script>
</head>
<body>
  <aside class="preview-tools" aria-label="原型场景工具">
    <strong>原型骨架 · 本地模拟</strong>
    <label>场景 <select id="scenario">
      <option value="content">内容</option><option value="loading">加载</option>
      <option value="empty">空状态</option><option value="error">失败恢复</option>
    </select></label>
    <button id="reset" type="button">重置样本</button>
    <a href="interaction.md">交互说明与视觉依据</a>
  </aside>
  <main class="prototype" aria-labelledby="page-title">
    <h1 id="page-title">{{PAGE_NAME}}</h1>
    <!-- 用已确认的页面任务替换示例；本骨架不定义产品业务事实。 -->
    <p id="status" role="status" aria-live="polite"></p>
    <section id="content">
      <form id="entry-form">
        <label for="entry">示例输入</label>
        <input id="entry" name="entry" required autocomplete="off">
        <button type="submit">查看输入</button>
      </form>
      <p id="result"></p>
      <button id="open-dialog" type="button">查看详情</button>
    </section>
    <button id="recover" type="button" hidden>重新加载</button>
  </main>
  <dialog id="detail-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title">示例详情</h2>
    <p>替换为目标页面的详情。关闭或 Esc 返回触发控件。</p>
    <form method="dialog"><button>关闭</button></form>
  </dialog>
</body>
</html>
