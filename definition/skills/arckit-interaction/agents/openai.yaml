interface:
  display_name: "ArcKit Interaction"
  short_description: "维护稳定页面交互、状态响应和灰度线框"
  default_prompt: "使用 $arckit-interaction 维护稳定页面交互事实。收到 case_fact_gap 时先读取共享 Case Fact Contract，结合规格或实现证据输出 document_scope 与 fact_result；实现存在不等于交互事实已完成。不写 Case/Project State、不决定 Case 完成。无 gap 时使用 standalone 模式。"
policy:
  allow_implicit_invocation: true
workflow:
  first_steps:
    - "读取 arckit/interaction/INDEX.md 并判断查询或变更。"
    - "变更时先做页面归属、状态覆盖和投影一致性分析。"
    - "只把稳定触发、响应、状态、异常和恢复行为写入事实源。"
  boundaries:
    - "本能力可由 Runtime 绑定给 Worker，但只能在 packet 的 allowed_skills、allowed_paths 和事实边界内执行。"
    - "不把视觉审美、技术实现或未确认探索写成交互事实。"
    - "不依赖已移除 skill；开放问题和待处理 handoff 保留在 active case。"
  output:
    - "document_scope"
    - "fact_result"
