interface:
  display_name: "ArcKit Spec"
  short_description: "维护稳定产品行为、规则和验收口径"
  default_prompt: "使用 $arckit-spec 维护稳定产品预期事实。收到 case_fact_gap 时先读取共享 Case Fact Contract，在 managed-case 模式下允许规格先行、代码先行或混合推进，输出 document_scope 与 evidence-backed fact_result；不写 Case/Project State、不决定 Case 完成。无 gap 时使用 standalone 模式。"
policy:
  allow_implicit_invocation: true
workflow:
  first_steps:
    - "读取 arckit/spec/INDEX.md 并判断查询或变更。"
    - "变更时先做域归属判定和体积分析。"
    - "只把稳定产品行为、规则和验收口径写入事实源。"
  boundaries:
    - "本能力可由 Runtime 绑定给 Worker，但只能在 packet 的 allowed_skills、allowed_paths 和事实边界内执行。"
    - "不把候选方案、执行计划、工程实现或未确认判断写入产品规格。"
    - "不依赖已移除 skill；开放问题和待处理 handoff 保留在 active case。"
  output:
    - "document_scope"
    - "fact_result"
