interface:
  display_name: "Using Arckit"
  short_description: "用同一 Agent 按可信场景定义推进有界 Gap"
  default_prompt: "使用 $using-arckit 围绕 Case 目标发现问题，逐项理解当前不变量与可信场景规则。先核对重要决定的依据和依赖，再比较合格 Gap；区分探索与正式建立，遵守事实顺序。新证据出现时重审受影响的具体主张，同一验收内继续调查与排障，重要前提或边界变化时提交、fresh-read 重选。完成前核对原有义务与实际证据，说明变化及剩余工作，遵守用户停止；结果验证前确定预期、Case、输出目录与保留方式，读取核验后引用；根因诊断仍由 debug skill 独立管理。"
policy:
  allow_implicit_invocation: true
