interface:
  display_name: "Using Arckit"
  short_description: "用同一 Agent 按可信场景定义推进有界 Gap"
  default_prompt: "使用 $using-arckit 围绕 Case 目标综合发现问题；读取并理解当前不变量，从可信 state_definition 恢复场景规则，业务 Gap 对应相关责任。审视已有 Gap 边界，先检查局部前置，再选择最能解除关键阻塞、减少返工或产生价值的具体结果；声明 selection_assessment，区分探索与正式建立，遵守事实顺序；同一验收内继续调查与排障，独立重要问题或关键前提变化时提交、fresh-read 重选。及时维护已形成的事实，依据证据判断进展、剩余义务和下一责任，遵守用户停止。"
policy:
  allow_implicit_invocation: true
