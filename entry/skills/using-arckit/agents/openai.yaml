interface:
  display_name: "Using Arckit"
  short_description: "用同一 Agent 按 Case gap 持续推进软件开发"
  default_prompt: "使用 $using-arckit 围绕 Case 目标综合发现问题；读取并理解当前不变量，逐项显式考虑作为必需保障，不限定 Gap 来源。审视已有 Gap 边界，选择当前最重要的独立问题并明确完成证据；新发现独立问题后提交、fresh-read 重选。及时维护已形成的事实，依据证据判断进展、剩余义务和下一责任，遵守用户停止。"
policy:
  allow_implicit_invocation: true
