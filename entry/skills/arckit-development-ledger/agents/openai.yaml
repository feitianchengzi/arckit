interface:
  display_name: "Arckit Development Ledger"
  short_description: "确定性维护 ledger 状态、协议恢复与 transition"
  default_prompt: "使用 $arckit-development-ledger 通过 trusted snapshot、selection token、Transition v8 和 closeout 确定性维护 Project/Iteration/Case。读取当前不变量定义后声明具体责任、证据和未决关系；不变量是必需保障而非 Gap 来源上限，Ledger 不替代语义判断。协议不兼容时验收保留历史与未完成义务的 reconciliation。"
policy:
  allow_implicit_invocation: true
