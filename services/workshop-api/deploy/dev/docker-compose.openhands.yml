# OpenHands Agent Server 部署配置
# 用法: docker compose -f docker-compose.dev.yml -f docker-compose.openhands.yml up -d

services:
  todo-service:
    volumes:
      - ${CUSTOMER_REPOS_PATH:-./customer-repos}:/workspace/customer-repos

  # OpenHands Agent Server
  openhands-agent:
    image: ${OPENHANDS_IMAGE:-ghcr.io/openhands/agent-server:1.54.0-python@sha256:082368832a7e48087b64da38c7b2cf2442dd7621fde69f8d06ed52283ff136f8}
    container_name: openhands-agent-dev
    environment:
      - OH_SESSION_API_KEYS_0=${OH_SESSION_API_KEYS_0}
      - OH_SECRET_KEY=${OH_SECRET_KEY}
      - OH_PERSISTENCE_DIR=/home/openhands/.openhands
      - SANDBOX_VOLUMES=/workspace/customer-repos:/workspace/customer-repos:ro
    ports:
      - "127.0.0.1:${OPENHANDS_PORT:-8000}:8000"
    volumes:
      - openhands-workspace:/home/openhands/.openhands
      - ${CUSTOMER_REPOS_PATH:-./customer-repos}:/workspace/customer-repos:ro
    restart: unless-stopped
    networks:
      - workshop
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  openhands-workspace:
