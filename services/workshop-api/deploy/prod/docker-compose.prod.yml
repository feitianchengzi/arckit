# 生产环境配置（仅应用服务，连接远程 RDS 数据库）
# 注意：生产环境使用已构建的镜像，不使用 build

# 指定项目名称，避免与其他docker compose项目冲突
name: workshop

services:
  todo-service:
    image: ${IMAGE_NAME:-todo-service}:${IMAGE_TAG:-latest}
    container_name: todo-service
    env_file:
      - .env.workshop.production  # 从 .env.workshop.production 文件加载所有环境变量
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    restart: unless-stopped
    stop_grace_period: 20s
    networks:
      - workshop
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  workshop:
    driver: bridge
